services:
  catalogo-db:
    image: postgres:17-alpine
    container_name: catalogo-db
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo123
    ports:
      - "5433:5432"
    volumes:
      - catalogo-data:/var/lib/postgresql/data

volumes:
  catalogo-data:
