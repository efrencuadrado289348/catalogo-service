services:
  catalog-db:
    image: postgres:17-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog123
    ports:
      - "5433:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogDb: Host=catalog-db;Port=5432;Database=catalog;Username=catalog;Password=catalog123
    ports:
      - "5080:8080"
    depends_on:
      catalog-db:
        condition: service_healthy

volumes:
  catalog-data:
